name: Sync TVBox

on:
  schedule:
    # 每 12 小时运行一次 (UTC 时间 00:00 和 12:00, 即北京时间 08:00 和 20:00)
    - cron: '0 */12 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 允许推送到仓库

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mytv 仓库
        uses: actions/checkout@v4
        with:
          repository: danteswx/mytv
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 克隆源仓库 ssm123-coder/a
        run: |
          git clone --depth 1 https://github.com/ssm123-coder/a.git /tmp/source

      - name: 同步内容到 tvbox 目录
        run: |
          # 首次运行时自动创建 tvbox 目录
          mkdir -p tvbox
          # 清空旧内容(保留目录本身), 确保删除的文件也会同步移除
          find tvbox -mindepth 1 -delete
          # 拷贝源仓库全部内容(排除 .git)到 tvbox 目录
          cd /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -r {} "$GITHUB_WORKSPACE/tvbox/" \;

      - name: 检测变更并提交推送
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "没有检测到变更, 跳过提交"
          else
            git add tvbox
            git commit -m "chore(tvbox): sync from ssm123-coder/a $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "同步完成并已推送"
          fi
